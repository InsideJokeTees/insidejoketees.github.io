<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Checkout – InsideJokeTees</title>
<style>
  :root{--bg:#faf7f2;--card:#fff;--ink:#222;--muted:#666;--accent:#b8325a;--line:#e8e2d9}
  @media (prefers-color-scheme:dark){:root{--bg:#18161a;--card:#231f25;--ink:#f2eee9;--muted:#aaa;--accent:#ff7aa2;--line:#3a3440}}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);padding:24px 16px}
  main{max-width:480px;margin:0 auto}
  h1{font-size:1.4rem;margin:0 0 6px}
  p{color:var(--muted);margin:0 0 18px;line-height:1.45}
  a.item{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;color:var(--ink);text-decoration:none;font-weight:600}
  a.item span{color:var(--accent);white-space:nowrap}
  a.item img{width:56px;height:56px;object-fit:cover;border-radius:8px;flex:none;background:var(--line)}
  a.item .nm{flex:1;min-width:0}
  a.item .nm small{display:block;font-weight:400;color:var(--muted)}
  a.item.done{opacity:.55}
  a.item.done span::before{content:'✓ Opened · '}
  .all{display:block;text-align:center;margin-top:14px;color:var(--accent)}
  .tot{display:flex;justify-content:space-between;font-weight:700;padding:12px 4px;border-top:1px solid var(--line);margin-top:6px}
  .fine{font-size:.8rem;color:var(--muted);margin:4px 4px 0}
  .code{background:var(--card);border:1px dashed var(--accent);border-radius:10px;padding:10px 14px;margin-bottom:18px}
</style>
</head>
<body>
<main id="app"><p>Taking you to checkout on Etsy…</p></main>
<script>
(function () {
  var SHOP = 'https://insidejoketeesshop.etsy.com';
  var q = new URLSearchParams(location.search);
  var coupon = (q.get('coupon') || '').trim();
  var items = (q.get('products') || '').split(',').map(function (p) {
    var parts = p.split(':');
    var id = (parts[0] || '').replace(/\D/g, '');
    var qty = parseInt(parts[1], 10) || 1;
    return id ? { id: id, qty: qty } : null;
  }).filter(Boolean);

  function listingUrl(id) {
    var u = SHOP + '/listing/' + id;
    return coupon ? u + '?coupon=' + encodeURIComponent(coupon) : u;
  }

  if (items.length === 0) { location.replace(SHOP); return; }
  if (items.length === 1) { location.replace(listingUrl(items[0].id)); return; }

  var app = document.getElementById('app');
  function esc(x){return String(x).replace(/[<>&"]/g,'')}
  function render(info){
    var html = '<h1>Almost there!</h1><p>We check out on Etsy. Tap each item to pick your size/color and add it to your Etsy cart.</p>';
    if (coupon) html += '<div class="code">Coupon code: <strong>' + esc(coupon) + '</strong></div>';
    items.forEach(function (it, n) {
      var p = info[it.id];
      var name = p ? esc(p[0]) : 'Item ' + (n + 1);
      var img = p ? '<img alt="" src="https://i.etsystatic.com/54277816/r/il/' + p[1] + '/' + p[2] + '/il_340x270.' + p[2] + '_' + p[3] + '.jpg">' : '';
      html += '<a class="item" target="_blank" rel="noopener" href="' + listingUrl(it.id) + '">' + img +
        '<div class="nm">' + name + '<small>' + (p ? '$' + (p[4] * it.qty).toFixed(2) + (it.qty > 1 ? ' (' + it.qty + ' × $' + p[4].toFixed(2) + ')' : '') : (it.qty > 1 ? 'Qty ' + it.qty : '')) + '</small>' + '</div><span>Open →</span></a>';
    });
    var sub = 0, known = true;
    items.forEach(function (it) { var p = info[it.id]; if (p) sub += p[4] * it.qty; else known = false; });
    if (known) html += '<div class="tot"><span>Subtotal</span><span>$' + sub.toFixed(2) + '</span></div><p class="fine">Free standard shipping (US). Final price, size and color are confirmed on Etsy.</p>';
    html += '<a class="all" href="' + SHOP + '">Or browse the whole shop on Etsy</a>';
    app.innerHTML = html;
    [].forEach.call(document.querySelectorAll('a.item'), function (a) {
      a.addEventListener('click', function () { a.classList.add('done'); });
    });
  }
  fetch('products.json?v=2').then(function (r) { return r.json(); }).then(render).catch(function () { render({}); });
})();
</script>
</body>
</html>
